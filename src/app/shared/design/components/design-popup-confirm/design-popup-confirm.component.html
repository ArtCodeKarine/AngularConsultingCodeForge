<div class="popup-confirm">
  <h2 class="popup-confirm-title" mat-dialog-title>
    <mat-icon class="popup-confirm-icon" svgIcon="line:exclamation-triangle"></mat-icon>
    {{ 'component.confirm.title' | translate }}
  </h2>
  <mat-dialog-content class="mat-typography">
    <div class="popup-confirm-message">
      <p>
        {{ 'component.confirm.message' | translate }}
      </p>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="popup-confirm-actions">
    <button mat-button mat-dialog-close color="primary">
      {{ 'component.confirm.cancel' | translate }}
    </button>
    <button mat-button [mat-dialog-close]="true" cdkFocusInitial color="accent">
      {{ 'component.confirm.confirm' | translate }}
    </button>
  </mat-dialog-actions>
</div>
